name: Deploy para Hetzner

# Só arranque manual (aba Actions ou `gh workflow run deploy-hetzner.yml`).
# O gatilho `on: push` foi removido de propósito: fazia de CADA push para
# `main` um deploy imediato para produção, o que (a) torna qualquer push uma
# acção irreversível e (b) faz o classificador de segurança bloquear o
# `git push` em sessões automáticas. Com o deploy desacoplado do push,
# guardar código no GitHub deixa de ser "publicar", e publicar passa a ser
# um passo deliberado.
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar chave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Aceitar a chave do servidor (known_hosts)
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2234 37.27.17.25 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Enviar código para o servidor (rsync)
        run: |
          rsync -avz --delete -e "ssh -p 2234" \
            --exclude node_modules \
            --exclude .next \
            --exclude .git \
            --exclude .github \
            --exclude '.env*' \
            --exclude .DS_Store \
            --exclude .claude \
            --exclude '*.bak-*' \
            ./ root@37.27.17.25:/opt/basededadosagro-site/

      # O `next build` desta app não cabe na RAM do servidor sozinho — sem
      # isto o build era morto pelo OOM a meio (a sessão SSH caía com
      # "Broken pipe", exit 255). Cria 4G de swap uma única vez.
      - name: Garantir swap no servidor (evita OOM no next build)
        run: |
          ssh -p 2234 root@37.27.17.25 '
            if ! swapon --show | grep -q "/swapfile"; then
              fallocate -l 4G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=4096
              chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
              grep -q "/swapfile" /etc/fstab || echo "/swapfile none swap sw 0 0" >> /etc/fstab
            fi
            free -m
          '

      # Guarda o .next anterior antes de reconstruir: se o build falhar,
      # repõe-se o build antigo para o pm2 continuar a arrancar (antes,
      # um `rm -rf .next` + build falhado deixava produção sem arranque).
      - name: Instalar, construir e reiniciar no servidor
        run: |
          ssh -p 2234 root@37.27.17.25 '
            set -e
            cd /opt/basededadosagro-site
            npm install
            rm -rf .next.bak; mv .next .next.bak 2>/dev/null || true
            if npm run build; then
              rm -rf .next.bak
              pm2 restart basededadosagro-site && pm2 save
            else
              echo "BUILD FALHOU — a repor .next anterior"
              rm -rf .next; mv .next.bak .next 2>/dev/null || true
              exit 1
            fi
          '

      # Sem isto, o Cloudflare continua a servir a página/HTML antigos em
      # cache (até 1h de s-maxage) mesmo depois do deploy correr sem
      # nenhum erro — já aconteceu várias vezes parecer que "não publicou"
      # quando na verdade só faltava isto. Purga tudo (mais simples e
      # fiável do que tentar apanhar cada URL/chunk específico).
      - name: Purgar cache do Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_ACCOUNT }}
          CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CF_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}
        run: |
          set -e
          ZONE_JSON=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=basededadosagro.com" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json")
          OK=$(echo "$ZONE_JSON" | python3 -c "import json,sys;print(json.load(sys.stdin).get('success'))")

          if [ "$OK" != "True" ]; then
            echo "Token Bearer falhou, a tentar Global API Key..."
            ZONE_JSON=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=basededadosagro.com" \
              -H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_KEY" -H "Content-Type: application/json")
            AUTH_ARGS=(-H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_KEY")
          else
            AUTH_ARGS=(-H "Authorization: Bearer $CF_TOKEN")
          fi

          ZONE_ID=$(echo "$ZONE_JSON" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['result'][0]['id'] if d.get('result') else '')")
          if [ -z "$ZONE_ID" ]; then
            echo "Não consegui obter o zone_id — a saltar a purga (não falha o deploy por isto)."
            echo "$ZONE_JSON"
            exit 0
          fi

          echo "zone_id: $ZONE_ID"
          RESULT=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            "${AUTH_ARGS[@]}" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$RESULT" | python3 -m json.tool || echo "$RESULT"
