name: Robô de notícias (agricultura + clima)

# Corre o endpoint /api/cron/news-fetch de forma automática, sem depender de
# ninguém disparar à mão. O endpoint é idempotente (dedup por `source_url`),
# por isso não faz mal se correr a mais.
#
# Pré-requisito (uma única vez): adicionar o segredo do repositório
#   gh secret set CRON_SECRET
# com o mesmo valor que a variável CRON_SECRET tem no servidor Hetzner.

on:
  schedule:
    - cron: '0 */6 * * *'   # a cada 6 horas (UTC) -> 02h, 08h, 14h, 20h em Maputo
  workflow_dispatch: {}       # permite um arranque imediato pela aba Actions

concurrency:
  group: news-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o robô de notícias
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET não está configurado. Corra uma vez: gh secret set CRON_SECRET"
            exit 1
          fi
          echo "A chamar https://basededadosagro.com/api/cron/news-fetch ..."
          RESP=$(curl -sS --fail-with-body -m 180 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://basededadosagro.com/api/cron/news-fetch")
          echo "Resposta: $RESP"
